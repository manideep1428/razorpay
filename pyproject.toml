[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-radar"
version = "0.1.0"
description = "Trust Radar: Graph Neural Networks and Machine Learning for Fraud & Abuse Detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torch-geometric",
    "lightgbm",
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "matplotlib",
    "jupyter",
    "ipykernel",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.28.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trust_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
